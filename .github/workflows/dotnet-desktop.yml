name: .NET Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5.0.1
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v5.2.0
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore GadgetHub.sln

    - name: Build
      run: dotnet build GadgetHub.sln --configuration ${{ matrix.configuration }} --no-restore
