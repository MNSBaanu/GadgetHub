name: .NET Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4.2.2
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4.3.1
      with:
        dotnet-version: 8.0.x

    - name: Restore ElectroComAPI
      run: dotnet restore ElectroComAPI/ElectroComAPI.sln

    - name: Build ElectroComAPI
      run: dotnet build ElectroComAPI/ElectroComAPI.sln --configuration ${{ matrix.configuration }} --no-restore

    - name: Restore GadgetCentralAPI
      run: dotnet restore GadgetCentralAPI/GadgetCentralAPI.sln

    - name: Build GadgetCentralAPI
      run: dotnet build GadgetCentralAPI/GadgetCentralAPI.sln --configuration ${{ matrix.configuration }} --no-restore

    - name: Restore GadgetHubAPI
      run: dotnet restore GadgetHubAPI/GadgetHubAPI.sln

    - name: Build GadgetHubAPI
      run: dotnet build GadgetHubAPI/GadgetHubAPI.sln --configuration ${{ matrix.configuration }} --no-restore

    - name: Restore GadgetHubWeb
      run: dotnet restore GadgetHubWeb/GadgetHubWeb.sln

    - name: Build GadgetHubWeb
      run: dotnet build GadgetHubWeb/GadgetHubWeb.sln --configuration ${{ matrix.configuration }} --no-restore

    - name: Restore TechWorldAPI
      run: dotnet restore TechWorldAPI/TechWorldAPI.sln

    - name: Build TechWorldAPI
      run: dotnet build TechWorldAPI/TechWorldAPI.sln --configuration ${{ matrix.configuration }} --no-restore
